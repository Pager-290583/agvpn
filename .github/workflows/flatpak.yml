name: Flatpak

# Every push to main builds the app for x86_64 and aarch64 and publishes a Flatpak
# repository on GitHub Pages:
#   flatpak install --user https://pager-290583.github.io/agvpn/agvpn.flatpakref
# (A single-file .flatpak bundle cannot be used: bundles do not carry the extra-data
# metadata needed to download the AdGuard VPN CLI at install time.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flatpak:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v5
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: agvpn-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/io.github.agvpn.AGVPN.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          upload-artifact: false
      - name: Pack OSTree repo
        shell: bash
        run: tar -cf ostree-${{ matrix.arch }}.tar repo
      - uses: actions/upload-artifact@v5
        with:
          name: ostree-${{ matrix.arch }}
          path: ostree-${{ matrix.arch }}.tar
          retention-days: 3

  helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sh -n helper/agvpn-helper

  repo:
    name: Assemble Flatpak repo
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [flatpak, helper]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: ostree-*
          path: in
          merge-multiple: true
      - name: Merge architectures into one repo
        shell: bash
        run: |
          set -eu
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          mkdir -p site
          ostree --repo=site/repo init --mode=archive-z2
          for arch in x86_64 aarch64; do
            mkdir "in/$arch"
            tar -xf "in/ostree-$arch.tar" -C "in/$arch"
            flatpak build-commit-from --src-repo="in/$arch/repo" --no-update-summary \
              site/repo "app/io.github.agvpn.AGVPN/$arch/master"
          done
          flatpak build-update-repo --generate-static-deltas --title=AGVPN \
            --default-branch=master site/repo
          sed "s|@URL@|$SITE_URL|g" flatpak/pages/agvpn.flatpakref > site/agvpn.flatpakref
          sed "s|@URL@|$SITE_URL|g" flatpak/pages/agvpn.flatpakrepo > site/agvpn.flatpakrepo
          sed -e "s|@URL@|$SITE_URL|g" -e "s|@SHA@|${GITHUB_SHA::7}|g" \
            -e "s|@DATE@|$(date -u '+%Y-%m-%d %H:%M UTC')|g" \
            flatpak/pages/index.html > site/index.html
          touch site/.nojekyll
          du -sh site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  pages:
    name: Publish to GitHub Pages
    needs: repo
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
