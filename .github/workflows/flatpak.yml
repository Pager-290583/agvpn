name: Flatpak

# Every push to main builds the app for x86_64 and aarch64 and publishes a Flatpak
# repository on GitHub Pages, then installer files in GitHub Releases:
#   flatpak install --user https://pager-290583.github.io/agvpn/agvpn.flatpakref
# (A single-file .flatpak bundle cannot be used: bundles do not carry the extra-data
# metadata needed to download the AdGuard VPN CLI at install time.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes older builds of the same branch.
concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: agvpn-flatpak-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'flatpak/cargo-sources.json') }}-${{ github.sha }}
          restore-keys: |
            agvpn-flatpak-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'flatpak/cargo-sources.json') }}-
      - name: Build and test Flatpak
        shell: bash
        run: |
          set -euo pipefail
          # The image's system SDK is in an OverlayFS lower layer. Updating it can
          # fail with EXDEV; install/update SDKs in a fresh writable user store.
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          dbus-run-session -- xvfb-run --auto-servernum flatpak-builder --user \
            --repo=repo --disable-rofiles-fuse --install-deps-from=flathub \
            --force-clean --keep-build-dirs --default-branch=master --arch=${{ matrix.arch }} \
            flatpak_app flatpak/io.github.agvpn.AGVPN.yml \
            2>&1 | tee "$RUNNER_TEMP/flatpak-${{ matrix.arch }}.log"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: build-log-${{ matrix.arch }}
          path: ${{ runner.temp }}/flatpak-${{ matrix.arch }}.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Pack OSTree repo
        shell: bash
        run: tar -cf ostree-${{ matrix.arch }}.tar repo
      - uses: actions/upload-artifact@v5
        with:
          name: ostree-${{ matrix.arch }}
          path: ostree-${{ matrix.arch }}.tar
          retention-days: 3

  helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sh -n helper/agvpn-helper
      - run: python3 -m unittest discover -s tests -v
      - name: Test real firewall rules in an isolated network namespace
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables
          sudo unshare --net env AGVPN_NFT_INTEGRATION=1 python3 -m unittest discover -s tests -v

  repo:
    name: Assemble Flatpak repo
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [flatpak, helper]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: ostree-*
          path: in
          merge-multiple: true
      - name: Merge architectures into one repo
        shell: bash
        run: |
          set -eu
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          mkdir -p site
          ostree --repo=site/repo init --mode=archive-z2
          for arch in x86_64 aarch64; do
            mkdir "in/$arch"
            tar -xf "in/ostree-$arch.tar" -C "in/$arch"
            flatpak build-commit-from --src-repo="in/$arch/repo" --no-update-summary \
              site/repo "app/io.github.agvpn.AGVPN/$arch/master"
          done
          flatpak build-update-repo --generate-static-deltas --title=AGVPN \
            --default-branch=master site/repo
          sed "s|@URL@|$SITE_URL|g" flatpak/pages/agvpn.flatpakref > site/agvpn.flatpakref
          sed "s|@URL@|$SITE_URL|g" flatpak/pages/agvpn.flatpakrepo > site/agvpn.flatpakrepo
          sed -e "s|@URL@|$SITE_URL|g" -e "s|@SHA@|${GITHUB_SHA::7}|g" \
            -e "s|@DATE@|$(date -u '+%Y-%m-%d %H:%M UTC')|g" \
            flatpak/pages/index.html > site/index.html
          touch site/.nojekyll
          du -sh site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/upload-artifact@v5
        with:
          name: published-installers
          path: |
            site/agvpn.flatpakref
            site/agvpn.flatpakrepo
          if-no-files-found: error
          retention-days: 7

  pages:
    name: Publish to GitHub Pages
    needs: repo
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Publish installer release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: published-installers
          path: published-installers
      - name: Prepare installer files and release notes
        id: prepare
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ID: ${{ github.run_id }}
        run: |
          python3 scripts/prepare-release.py --site-dir published-installers \
            --output-dir release-assets --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" --run-number "$BUILD_NUMBER" --run-id "$BUILD_ID" \
            >> "$GITHUB_OUTPUT"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_TITLE: ${{ steps.prepare.outputs.title }}
        run: bash scripts/publish-release.sh "$RELEASE_TAG" "$RELEASE_TITLE" release-assets
